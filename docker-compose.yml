services:
  minio:
    build:
      context: .
      dockerfile: Dockerfile.minio
      target: minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    build:
      context: .
      dockerfile: Dockerfile.minio
      target: mc
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
        do sleep 2; done;
        mc mb --ignore-existing "local/$${MODEL_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MODEL_BUCKET: ${MODEL_BUCKET:-fashion-minst-bucket}
    restart: "no"

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    ports:
      - "5000:5000"
    environment:
      MLFLOW_PORT: 5000
      MLFLOW_BACKEND_STORE_URI: sqlite:////mlflow/mlflow.db
      MLFLOW_ARTIFACTS_DESTINATION: /mlflow/artifacts
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  webhook-receiver:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    command: ["python", "scripts/webhook_receiver.py"]
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 5001), timeout=5).close()"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  train-model:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    command: ["python", "scripts/train_model.py", "--config", "configs/training.toml"]
    environment:
      MINIO_ENDPOINT_URL: ${MINIO_ENDPOINT_URL:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER}}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD}}
      MODEL_BUCKET: ${MODEL_BUCKET:-fashion-minst-bucket}
      MODEL_OBJECT_KEY: ${MODEL_OBJECT_KEY:-}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: fashion-mnist
      WEBHOOK_URL: ${WEBHOOK_URL:-http://webhook-receiver:5001/notify}
      LOG_LEVEL: INFO
    volumes:
      - fashion-data:/app/data
    depends_on:
      minio-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
      webhook-receiver:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

  ml-api:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    ports:
      - "8000:8000"
    environment:
      MINIO_ENDPOINT_URL: ${MINIO_ENDPOINT_URL:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER}}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD}}
      MODEL_BUCKET: ${MODEL_BUCKET:-fashion-minst-bucket}
      MODEL_OBJECT_KEY: ${MODEL_OBJECT_KEY:-}
      LOG_LEVEL: INFO
    depends_on:
      train-model:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    command: ["python", "-m", "streamlit", "run", "ui/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
    environment:
      API_URL: http://ml-api:8000
    depends_on:
      ml-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  minio-data:
  mlflow-data:
  fashion-data:
